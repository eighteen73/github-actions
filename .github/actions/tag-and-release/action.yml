name: "Tag and Release"
description: "Creates a git tag and GitHub release based on version inside a WordPress plugin header."

inputs:
  plugin_file:
    description: "Path to the main WordPress plugin file containing the Version header."
    required: true
  target_branch:
    description: "Branch to tag (e.g., release)."
    required: true
  source_branch:
    description: "Branch to generate release notes from (where real merges land, e.g. main)."
    required: false
    default: "main"
  github_token:
    description: "GitHub token for creating tags and releases"
    required: true

outputs:
  version:
    description: "Extracted version from the plugin file"
    value: ${{ steps.version.outputs.version }}
  tag:
    description: "Generated git tag (prefixed with v)"
    value: ${{ steps.version.outputs.tag }}

runs:
  using: "composite"
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Extract version from plugin file
      id: version
      shell: bash
      run: |
        FILE="${{ inputs.plugin_file }}"

        if [ ! -f "$FILE" ]; then
          echo "Plugin file '$FILE' not found!"
          exit 1
        fi

        # Extract the version from the header
        VERSION=$(grep -Ei '^ \* Version:' "$FILE" | sed -E 's/.*Version:[[:space:]]*//')

        if [ -z "$VERSION" ]; then
          echo "Could not extract version from $FILE"
          exit 1
        fi

        # Prefix with "v" for tags
        TAG="v$VERSION"

        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"

    - name: Check if tag already exists
      id: check_tag
      shell: bash
      run: |
        if git rev-parse "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
          echo "Tag already exists"
          echo "tag_exists=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Abort if tag exists
      if: steps.check_tag.outputs.tag_exists == 'true'
      shell: bash
      run: exit 1

    - name: Generate release notes from source branch
      id: notes
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        set -euo pipefail

        TAG="${{ steps.version.outputs.tag }}"
        SOURCE="${{ inputs.source_branch }}"

        git fetch origin "${SOURCE}" --tags

        # Latest existing version tag becomes the notes baseline (new tag is not created yet).
        PREV_TAG="$(git tag -l 'v*' --sort=-v:refname | head -n1 || true)"

        ARGS=( -f "tag_name=${TAG}" -f "target_commitish=${SOURCE}" )
        if [ -n "${PREV_TAG}" ]; then
          echo "Generating notes from ${PREV_TAG}..${SOURCE}"
          ARGS+=( -f "previous_tag_name=${PREV_TAG}" )
        else
          echo "No previous tag found; generating notes up to ${SOURCE}"
        fi

        BODY="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" "${ARGS[@]}" --jq .body)"

        {
          echo "body<<EOF"
          printf '%s\n' "${BODY}"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Create and push tag
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git fetch origin ${{ inputs.target_branch }}
        git checkout ${{ inputs.target_branch }}

        git tag "${{ steps.version.outputs.tag }}"
        git push origin "${{ steps.version.outputs.tag }}"

    - name: Create GitHub Release
      uses: ncipollo/release-action@cdcc88a9acf3ca41c16c37bb7d21b9ad48560d87
      with:
        tag: ${{ steps.version.outputs.tag }}
        name: ${{ steps.version.outputs.tag }}
        body: ${{ steps.notes.outputs.body }}
        draft: false
        prerelease: false
        token: ${{ inputs.github_token }}
